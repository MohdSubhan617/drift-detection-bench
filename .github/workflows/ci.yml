name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pip_audit --local --skip-editable --progress-spinner off --timeout 60
      - run: python -m pytest -q
